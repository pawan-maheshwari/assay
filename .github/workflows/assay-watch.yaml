name: Assay release watch

on:
  schedule:
    - cron: "30 3 * * 1"   # Mondays 03:30 UTC (09:00 IST)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: assay-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tools
        run: |
          npm install --no-save jsdom@24 playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Check releases, run tests, build report
        run: node watcher/watch.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Publish results
        run: |
          git config user.name "assay-bot"
          git config user.email "assay-bot@users.noreply.github.com"
          git add scenarios results reports watch
          git diff --cached --quiet || git commit -m "Assay watch $(date -u +%F)"
          git push
